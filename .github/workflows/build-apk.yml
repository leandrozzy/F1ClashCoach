name: Gerar APK Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME); o Gradle baixa o que faltar.
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do núcleo (estratégia, OCR, IA)
        run: ./gradlew :core:test --stacktrace

      - name: Compilar APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk F1-Clash-Coach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: F1-Clash-AI-Coach-APK
          path: F1-Clash-Coach.apk

      # Na main, publica uma Release com o APK: dá para baixar e instalar direto pelo celular.
      - name: Publicar release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: F1 Clash Coach 1.0.${{ github.run_number }}
          body: "Baixe o arquivo F1-Clash-Coach.apk abaixo e instale no Android."
          files: F1-Clash-Coach.apk
          make_latest: true
